<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASI:One</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        
        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        
        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loader-content {
            text-align: center;
            color: white;
        }
        
        .loader-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        .loader-content h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-status {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .bypass-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid rgba(76, 175, 80, 0.6);
            border-radius: 20px;
            font-size: 12px;
            color: #a5ffaa;
            backdrop-filter: blur(10px);
        }
        
        /* Iframe */
        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }
        
        /* Contrôles de débogage (optionnel) */
        #debug-controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 11px;
            z-index: 10000;
            display: none;
        }
        
        #debug-controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            font-size: 11px;
        }
        
        #debug-controls button:hover {
            background: #5568d3;
        }
        
        /* Message d'erreur */
        #error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            padding: 20px;
        }
        
        .error-content {
            text-align: center;
            color: white;
            max-width: 350px;
        }
        
        .error-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .error-content h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .error-content p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 25px;
        }
        
        .error-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .error-buttons button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .error-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo">AI</div>
            <h1>ASI:ONE</h1>
            <div class="spinner"></div>
            <div class="loader-status">Chargement en cours...</div>
            <div class="bypass-badge">🛡️ Bypass X-Frame-Options activé</div>
        </div>
    </div>
    
    <!-- Overlay d'erreur -->
    <div id="error-overlay">
        <div class="error-content">
            <div class="error-icon">⚠️</div>
            <h2>Échec du chargement</h2>
            <p>Le site ASI:One n'a pas pu être chargé dans la sidebar malgré le bypass. Vous pouvez l'ouvrir dans un nouvel onglet.</p>
            <div class="error-buttons">
                <button class="btn-primary" onclick="openInNewTab()">Ouvrir dans un onglet</button>
                <button class="btn-secondary" onclick="retryLoading()">Réessayer</button>
            </div>
        </div>
    </div>
    
    <!-- Iframe principal -->
    <iframe 
        id="content-frame"
        src="https://asi1.ai"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-modals"
        allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"
    ></iframe>
    
    <!-- Contrôles de débogage (Shift + D pour activer) -->
    <div id="debug-controls">
        <div><strong>Debug Controls</strong></div>
        <button onclick="reloadIframe()">🔄 Recharger</button>
        <button onclick="openInNewTab()">🚀 Nouvel onglet</button>
        <button onclick="toggleDebug()">❌ Fermer</button>
    </div>
    
    <script src="sidepanel.js"></script>
</body>
</html>
